<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Khan Calculator">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Khan Calculator</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><span class="hamburger">☰</span></button>
      <div class="brand">Khan Calculator</div>
      <div class="top-actions">
        <button class="top-icon" id="historyBtn" aria-label="History"><span>◷</span><small>History</small></button>
        <button class="top-icon" id="unitBtn" aria-label="Unit Converter"><span>⇄</span><small>Unit</small></button>
        <button class="top-icon" id="portraitBtn" aria-label="Portrait"><span>▯</span><small>Portrait</small></button>
      </div>
    </header>

    <section class="display" aria-live="polite">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </section>

    <section class="keypad" aria-label="Calculator keypad">
      <button class="key utility" data-action="clear">C</button>
      <button class="key utility" data-action="backspace">⌫</button>
      <button class="key utility" data-action="percent">%</button>
      <button class="key operator" data-value="÷">÷</button>

      <button class="key number" data-value="7">7</button>
      <button class="key number" data-value="8">8</button>
      <button class="key number" data-value="9">9</button>
      <button class="key operator" data-value="×">×</button>

      <button class="key number" data-value="4">4</button>
      <button class="key number" data-value="5">5</button>
      <button class="key number" data-value="6">6</button>
      <button class="key operator" data-value="−">−</button>

      <button class="key number" data-value="1">1</button>
      <button class="key number" data-value="2">2</button>
      <button class="key number" data-value="3">3</button>
      <button class="key operator" data-value="+">+</button>

      <button class="key utility" data-action="sign">+/−</button>
      <button class="key number zero" data-value="0">0</button>
      <button class="key number" data-value=".">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>
  </main>

  <dialog id="panel">
    <div class="panel-head"><strong id="panelTitle">History</strong><button id="closePanel">×</button></div>
    <div id="panelBody" class="panel-body"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
